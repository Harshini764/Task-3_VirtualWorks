<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coffee Rating App</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f2f2f2; color: #333; margin: 0; padding: 20px; }
    .container { max-width: 600px; margin: 0 auto; background: #fff; box-shadow: 0 4px 16px rgba(0,0,0,.08); border-radius: 12px; padding: 24px; }
    h1 { margin-top: 0; }
    .item { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid #eee; }
    .item:last-child { border-bottom: none; }
    .item-name { font-weight: 600; }
    .votes { color: #666; margin-right: 16px; }
    .actions { margin-bottom: 18px; }
    .form-row { display: flex; gap: 10px; margin-bottom: 12px; }
    .form-row input { flex: 1; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; }
    .total-votes { margin-bottom: 12px; font-weight: 600; }
    button { background: #005dff; border: none; color: #fff; padding: 8px 14px; border-radius: 8px; cursor: pointer; transition: background .2s ease; }
    button:hover { background: #0045c1; }
    .message { margin-top: 12px; color: #2a7a2a; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Coffee Rating</h1>
    <div class="actions">
      <div class="form-row">
        <input id="new-item-name" type="text" placeholder="Add a new coffee name" />
        <button id="add-item-button">Add Coffee</button>
      </div>
      <div class="total-votes">Total votes: <span id="total-votes">0</span></div>
      <button id="reset-button">Reset All Votes</button>
    </div>
    <div id="items"></div>
    <div id="message" class="message"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
